repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: build-marketplace
        name: marketplace.json is current
        entry: python3 scripts/build_marketplace.py --check
        language: system
        pass_filenames: false

      - id: validate-skills
        name: skills follow the authoring rules
        entry: python3 scripts/validate_skills.py
        language: system
        pass_filenames: false

      - id: check-leaks
        name: no private content reaching a public repo
        entry: python3 scripts/check_leaks.py --staged
        language: system
        pass_filenames: false
        always_run: true
